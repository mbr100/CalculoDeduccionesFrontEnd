# =============================================================================
# Calculadora IDI — Configuración nginx
#
# Propósito:
#   1. Servir los estáticos del build de Angular (SPA)
#   2. Redirigir cualquier ruta desconocida a index.html (soporte de rutas SPA)
#   3. Hacer proxy inverso de /api/ al contenedor backend (Spring Boot)
#
# Esta configuración va dentro del contenedor frontend.
# El backend se identifica como 'backend' gracias a la red Docker interna.
# =============================================================================

# Número de procesos worker. 'auto' iguala al número de CPUs disponibles.
worker_processes auto;

# Salida de errores a stdout para que docker logs los capture
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Logs hacia stdout/stderr para docker logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Tipos MIME estándar
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimizaciones de rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Resolución DNS interna de Docker
    # Necesario para que proxy_pass resuelva el hostname 'backend'
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Directorio raíz donde están los ficheros del build de Angular
        root /usr/share/nginx/html;
        index index.html;

        # ── Proxy inverso para el API ────────────────────────────────────────
        # Cualquier petición que empiece por /api/ se reenvía al backend.
        # La variable $backend_url obliga a nginx a resolver el DNS dinámicamente,
        # lo que evita errores de inicio si el contenedor backend aún no está listo.
        location /api/ {
            set $backend_url http://backend:8080;
            proxy_pass $backend_url;

            # Cabeceras estándar de proxy para que Spring Boot reciba la IP real
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts generosos para operaciones de cálculo largas
            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Ficheros estáticos — caché agresiva ──────────────────────────────
        # Los assets de Angular llevan hash en el nombre, por lo que pueden
        # cachearse indefinidamente en el navegador.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        # Cualquier ruta que no sea un fichero físico se sirve con index.html
        # para que el router de Angular gestione la navegación del lado del cliente.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Desactivar logs para favicon y robots (reduce ruido)
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
